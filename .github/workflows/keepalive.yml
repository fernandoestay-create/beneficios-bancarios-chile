name: Keep-alive (mantener la web despierta)

# Render plan gratuito suspende el servicio tras ~15 min sin visitas, y la primera
# carga despues tarda ~40s (se ve en blanco). Este workflow pinguea la web cada 10
# min en horario de uso (Chile) para que este siempre despierta y los links del mail
# carguen al instante. Ligero: solo un curl, no scrapea nada.

# APAGADO el 2026-08-24: existía para que Render no durmiera. El servicio vive
# ahora en un VPS propio que NO duerme, así que solo gastaba ~2.340 ejecuciones
# al mes (≈39% de los 2.000 min gratis) sin servir a nada.
#
# OJO al volver a encenderlo: NO basta con comentar la línea del cron dejando
# la clave `schedule:` vacía — eso es YAML inválido y GitHub responde creando
# una corrida FALLIDA en cada push para avisar del error. Pasó el 2026-08-24 y
# estuvo mandando correos de fallo un día entero. La clave se quita entera.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar la web
        run: |
          for path in /estadisticas /ver; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://datalab-api.duckdns.org$path" || echo "000")
            echo "$path -> HTTP $code"
          done
