# ⚠️ LEGACY / FALLBACK DORMIDO — Render quedó SUSPENDIDO el 2026-08-23.
# Producción vive hoy en el VPS propio (https://datalab-api.duckdns.org), que NO
# lee este archivo (usa ~/servicios/cartera.env). Este render.yaml se conserva SOLO
# como plan B para revivir en Render. Si lo revives: los webhook URLs de abajo
# apuntan a onrender (correcto para Render), pero recuerda re-apuntar Twilio/Telegram
# y que api.py auto-registra Telegram con TELEGRAM_WEBHOOK_URL al arrancar.
# El 2º servicio legacy (whatsapp_bot.py, un bot paralelo SIN firma Twilio) se
# eliminó el 2026-08-31: era una trampa de recuperación (L-38). El bot real vive
# en api.py (/webhook con firma + /telegram).
services:
  - type: web
    name: api-beneficios-chile
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENV
        value: us-east-1
      - key: PINECONE_INDEX
        value: beneficios-bancarios
      - key: PINECONE_HOST
        value: beneficios-bancarios-96gaajy.svc.aped-4627-b74a.pinecone.io
      # Firma del webhook de Twilio (opt-in). El token es SECRETO: sync:false =>
      # se setea en el dashboard de Render, nunca en git. Al setearlo, la firma
      # se valida y se rechaza (403) toda request no firmada por Twilio.
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WEBHOOK_URL
        value: https://api-beneficios-chile.onrender.com/webhook
      # Bot de Telegram (opt-in, gratis). El token de BotFather es SECRETO:
      # sync:false => se pega en el dashboard de Render. Al setearlo, el arranque
      # auto-registra el webhook de Telegram en TELEGRAM_WEBHOOK_URL.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://api-beneficios-chile.onrender.com/telegram
